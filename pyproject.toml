[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "davincis"
version = "1.0.0"
description = "Detection of aggressive and violent incidents in Spanish tweets (DA-VINCIS @ IberLEF 2022)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Atnafu Lambebo Tonja" }, { name = "Muhammad Arif" }, { name = "Olga Kolesnikova" },
  { name = "Alexander Gelbukh" }, { name = "Grigori Sidorov" },
]
dependencies = ["pandas", "numpy", "scikit-learn>=1.2", "pyyaml"]

[project.optional-dependencies]
train = ["torch>=2.0", "transformers>=4.41", "datasets>=2.14", "accelerate>=0.25"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
